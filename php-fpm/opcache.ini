; OPcache — local-dev tuning.
; validate_timestamps=1 + revalidate_freq=0 → file edits are picked up immediately
; (in production, set validate_timestamps=0 and reload PHP-FPM on deploy).

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.fast_shutdown=1
opcache.save_comments=1

; JIT — modest tracing JIT, helps CPU-heavy code paths. Comment out if it causes issues.
opcache.jit=tracing
opcache.jit_buffer_size=64M
