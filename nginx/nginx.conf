user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    # Uploads — match PHP's post_max_size (php.ini = 55M)
    client_max_body_size      55M;
    client_body_buffer_size   128k;

    # FastCGI buffers — defaults (4×4k) are tiny; bump for typical PHP responses
    fastcgi_buffer_size       16k;
    fastcgi_buffers           16 16k;
    fastcgi_busy_buffers_size 32k;
    fastcgi_read_timeout      300;

    # Gzip
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml application/xml+rss application/rss+xml application/atom+xml
                      image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # Default security headers (vhosts can override)
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    include /etc/nginx/conf.d/*.conf;
}
