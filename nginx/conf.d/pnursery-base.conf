server {
    listen 80;
    server_name www.pnursery.lc pnursery.lc;

    root /var/www/pnursery-base/app/webroot;
    index index.php index.html;

    access_log /var/log/nginx/pnursery-base.access.log;
    error_log /var/log/nginx/pnursery-base.error.log;

    include /etc/nginx/snippets/static-files.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        set $php_upstream php_pnursery_base:9000;
        fastcgi_pass $php_upstream;
    }
}

