# Serve common static assets directly from disk — never hit PHP-FPM.
# Cache aggressively; turn off access logging to reduce noise + I/O.
location ~* \.(?:jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot|otf|map)$ {
    try_files   $uri =404;
    access_log  off;
    expires     30d;
    add_header  Cache-Control "public, immutable";
}

# Deny access to dotfiles (.htaccess, .git, .env, etc.)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
